_format_version: "2.1"

services:
  - name: manejador-reportes
    host: upstream-reportes
    port: 8080
    protocol: http
    routes:
      - name: reportes-route
        paths:
          - /api/reportes
          - /reportes
        strip_path: false
    # Quitar plugins Enterprise si solo usas OSS
    plugins: []

upstreams:
  - name: upstream-reportes
    algorithm: least-connections
    targets:
      - target: 54.198.72.197:8080
      - target: 54.235.57.153:8080
      - target: 54.82.13.45:8080
      - target: 100.54.231.47:8080
