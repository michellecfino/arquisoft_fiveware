services:
  web:
    build: .
    restart: unless-stopped
    environment:
      HEARTBEAT_DISABLED: "1"
    expose:
      - "8000"
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn src.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"

  heartbeat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: python -m src.heartbeat
    depends_on:
      - web

  kong:
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yaml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8001"
    depends_on:
      - web
