_format_version: "2.1"

services:
  - name: manejador-reportes
    host: upstream-reportes   # El nombre de tu upstream
    port: 8080               # Puerto donde corre Django
    protocol: http
    routes:
      - name: reportes-route
        paths:
          - /api/reportes
          - /reportes
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp", "aud"]  # Validamos expiración y audience
          key_claim_name: "iss"              # Opcional, si quieres validar issuer

upstreams:
  - name: upstream-reportes
    algorithm: least-connections
    targets:
      - target: 172.31.17.51:8080
      - target: 172.31.26.43:8080
      - target: 172.31.18.237:8080
      - target: 172.31.17.54:8080