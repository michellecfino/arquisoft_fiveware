<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BITE.co | Panel de Auditoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .badge-service { background-color: #6c5ce7; color: white; }
    </style>
</head>
<body>
    <div class="container table-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Historial de Integridad y Logs</h2>
            <span class="badge bg-success">Sistema Activo</span>
        </div>
        
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Fecha (UTC)</th>
                    <th>Usuario</th>
                    <th>Servicio</th>
                    <th>Acción Realizada</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td class="text-muted">{{ log.created_at|date:"Y-m-d H:i:s" }}</td>
                    <td><strong>{{ log.user_id }}</strong> <small class="text-capitalize">({{ log.role|lower }})</small></td>
                    <td><span class="badge badge-service">{{ log.service }}</span></td>
                    <td>{{ log.action }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No hay registros de auditoría disponibles.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
