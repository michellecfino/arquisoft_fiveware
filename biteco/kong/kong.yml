_format_version: "2.1"

services:
  - name: manejador-reportes
    host: upstream-reportes      # Nombre del upstream
    port: 8080                   # Puerto donde corre Django en cada instancia
    protocol: http
    connect_timeout: 10000       # 10 segundos para conectarse al backend
    read_timeout: 10000          # 10 segundos para recibir respuesta
    write_timeout: 10000         # 10 segundos para enviar request
    routes:
      - name: reportes-route
        paths:
          - /api/reportes
          - /reportes
        strip_path: false
    plugins: []                  # Sin plugins Enterprise

upstreams:
  - name: upstream-reportes
    algorithm: least-connections
    targets:
      - target: 172.31.17.51:8080  # privada
      - target: 172.31.26.43:8080
      - target: 172.31.18.237:8080
      - target: 172.31.17.54:8080
