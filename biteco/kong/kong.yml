_format_version: "3.0"

services:

  # =====================================================
  # REPORTES
  # =====================================================

  - name: reportes-service

    host: reportes_upstream
    port: 8080
    protocol: http

    routes:
      - name: reportes-route
        paths:
          - /reportes
        strip_path: false

    plugins:
      - name: jwt

  # =====================================================
  # AUDITORIA
  # =====================================================

  - name: audit-service

    host: audit_upstream
    port: 8002
    protocol: http

    routes:
      - name: audit-route
        paths:
          - /audit
        strip_path: false

    plugins:
      - name: jwt

# =====================================================
# UPSTREAMS
# =====================================================

upstreams:

  # Cluster reportes
  - name: reportes_upstream

    targets:
      - target: 10.0.2.95:8080
        weight: 100

      - target: 10.0.2.68:8080
        weight: 100

      - target: 10.0.2.101:8080
        weight: 100

      - target: 10.0.2.179:8080
        weight: 100

  # Audit server
  - name: audit_upstream

    targets:
      - target: 10.0.2.117:8002
        weight: 100