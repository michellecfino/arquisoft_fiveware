_format_version: "2.1"

# -----------------------------
# CONSUMERS (usuarios y JWT)
# -----------------------------
consumers:
  - username: admin
    jwt_secrets:
      - key: "https://biteco/api"
        secret: "superclave_prueba_123456"
        algorithm: HS256

  - username: user
    jwt_secrets:
      - key: "https://biteco/api"
        secret: "superclave_prueba_123456"
        algorithm: HS256

# -----------------------------
# SERVICIOS (upstream Django reportes)
# -----------------------------
services:
  - name: manejador-reportes
    host: upstream-reportes
    port: 8080
    protocol: http
    routes:
      - name: reportes-route
        paths:
          - /api/reportes
          - /reportes
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
          key_claim_name: iss  # 'iss' del JWT será usado para buscar credenciales

# -----------------------------
# UPSTREAMS (balanceo simple)
# -----------------------------
upstreams:
  - name: upstream-reportes
    algorithm: least-connections
    targets:
      - target: 172.31.17.51:8080
      - target: 172.31.26.43:8080
      - target: 172.31.18.237:8080
      - target: 172.31.17.54:8080