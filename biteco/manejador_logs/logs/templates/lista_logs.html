<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BITE.co | Panel de Auditoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .header-box { background: #2c3e50; color: white; padding: 25px; margin-bottom: 30px; border-radius: 0 0 20px 20px; }
        .card-logs { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; }
        .badge-service { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="header-box text-center">
        <h1>🔍 Consola de Auditoría BITE.co</h1>
        <p>Registros de Integridad en AWS RDS</p>
    </div>

    <div class="container">
        <div class="card-logs">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Timestamp (UTC)</th>
                        <th>Usuario</th>
                        <th>Servicio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.created_at|date:"Y-m-d H:i:s" }}</td>
                        <td><strong>{{ log.user_id }}</strong> <small>({{ log.role }})</small></td>
                        <td><span class="badge badge-service">{{ log.service|upper }}</span></td>
                        <td>{{ log.action }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center">No hay logs registrados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
