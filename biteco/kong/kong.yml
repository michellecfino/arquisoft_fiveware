_format_version: "2.1"

services:
  - name: manejador-reportes
    host: upstream-reportes
    port: 8000
    protocol: http
    routes:
      - name: reportes-route
        paths:
          - /api/reportes
          - /reportes
        strip_path: false
    # Quitar plugins Enterprise si solo usas OSS
    plugins: []

upstreams:
  - name: upstream-reportes
    algorithm: least-connections
    targets:
      - target: 172.31.21.8:8000
      - target: 172.31.29.97:8000
      - target: 172.31.30.155:8000
      - target: 172.31.23.17:8000
