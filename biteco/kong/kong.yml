_format_version: "2.1"

services:
  # Servicio de Reportes
  - name: reportes-service
    host: reportes_upstream
    port: 8080
    protocol: http
    routes:
      - name: reportes-route
        paths:
          - /reportes
        strip_path: false
    plugins:
      - name: oidc
        enabled: true
        config:
          client_id: "74mkqdaihucqdgs5u96bt2rvio"
          client_secret: ""
          discovery: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_G7d7Hpkdz/.well-known/openid-configuration"
          redirect_uri: "https://13.220.29.135:8443/reportes"
          scope: "openid email profile"
          ssl_verify: "no"
          session_secret: "mi-secreto-super-seguro-12345"

  # Servicio de Auditoría
  - name: audit-service
    host: audit_upstream
    port: 8002
    protocol: http
    routes:
      - name: audit-route
        paths:
          - /audit
        strip_path: false
    plugins:
      - name: oidc
        enabled: true
        config:
          client_id: "74mkqdaihucqdgs5u96bt2rvio"
          client_secret: ""
          discovery: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_G7d7Hpkdz/.well-known/openid-configuration"
          redirect_uri: "https://13.220.29.135:8443/audit"
          scope: "openid email profile"
          ssl_verify: "no"
          bearer_only: "yes"

upstreams:
  - name: reportes_upstream
    targets:
      - target: 10.0.2.139:8080
        weight: 100
      - target: 10.0.2.123:8080
        weight: 100
      - target: 10.0.2.67:8080
        weight: 100
      - target: 10.0.2.156:8080
        weight: 100

  - name: audit_upstream
    targets:
      - target: 10.0.2.215:8002
        weight: 100